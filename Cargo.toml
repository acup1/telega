[package]
name = "telega"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Keyboard-first Telegram client for the terminal"
license = "GPL-3.0-only"

[workspace]
members = ["vendor/terminalib"]
resolver = "3"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
flate2 = "1.1"
grammers-client = "0.12.0"
grammers-mtsender = "0.12.0"
grammers-session = "0.12.0"
libc = "0.2"
rpassword = "7.4"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
terminalib = { path = "vendor/terminalib" }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2"
unicode-segmentation = "1.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
